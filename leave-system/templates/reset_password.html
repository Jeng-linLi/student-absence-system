{% extends "base.html" %}
{% block title %}重設密碼 · 線上請假系統{% endblock %}
{% block content %}
<h1>重設密碼</h1>

<div class="card" style="max-width:480px">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>新密碼（至少 8 碼，需含大寫、小寫字母與數字，且不可與帳號相同、不可為常見弱密碼）</label>
    <input type="password" name="new_password" required minlength="8" autofocus autocomplete="new-password">
    <label>確認新密碼</label>
    <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
    <div class="actions">
      <button class="btn" type="submit">重設密碼</button>
      <a class="btn ghost" href="{{ url_for('login') }}">返回登入</a>
    </div>
  </form>
  <p class="muted" style="margin:12px 0 0">
    重設成功後，所有舊登入狀態會立即失效；此連結也只能使用一次。
  </p>
</div>
{% endblock %}
