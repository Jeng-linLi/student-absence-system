{% extends "base.html" %}
{% block title %}修改密碼 · 線上請假系統{% endblock %}
{% block content %}
<h1>修改密碼</h1>

<div class="card" style="max-width:480px">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>目前密碼</label>
    <input type="password" name="old_password" required autofocus>
    <label>新密碼（至少 8 個字元）</label>
    <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
    <label>確認新密碼</label>
    <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
    <div class="actions">
      <button class="btn" type="submit">更新密碼</button>
      <a class="btn ghost" href="{{ url_for('dashboard') }}">取消</a>
    </div>
  </form>
  <p class="muted" style="margin:12px 0 0">
    更新後會自動登出，請用新密碼重新登入。
    演示帳號的初始密碼為 <span class="mono">Pass@123</span>，上線環境請務必修改。
  </p>
</div>
{% endblock %}
