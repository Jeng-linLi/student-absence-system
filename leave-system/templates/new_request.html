{% extends "base.html" %}
{% block title %}提交假單 · 線上請假系統{% endblock %}
{% block content %}
<h1>提交假單</h1>

<div class="card">
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row">
      <div>
        <label>假別 *</label>
        <select name="leave_type_id" id="lt" required>
          {% for t in types %}
            <option value="{{ t.id }}" data-att="{{ t.requires_attachment }}"
                    data-nf="{{ t.needs_faculty }}">{{ t.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label>聯絡電話（{{ MAX_PHONE_LEN }} 字內）</label>
        <input name="contact_phone" maxlength="{{ MAX_PHONE_LEN }}" value="{{ form.get('contact_phone','') }}" placeholder="請假期間可聯繫的手機">
      </div>
    </div>

    <div class="row" style="grid-template-columns:1fr 1fr 1fr 1fr">
      <div><label>開始日期 *</label><input type="date" name="start_date" required
        min="{{ min_date }}" max="{{ max_date }}"
        value="{{ form.get('start_date','') }}"></div>
      <div><label>開始時段</label>
        <select name="start_period">
          <option value="AM">上午（全日計）</option>
          <option value="PM">下午（半日計）</option>
        </select></div>
      <div><label>結束日期 *</label><input type="date" name="end_date" required
        min="{{ min_date }}" max="{{ max_date }}"
        value="{{ form.get('end_date','') }}"></div>
      <div><label>結束時段</label>
        <select name="end_period">
          <option value="PM">下午（全日計）</option>
          <option value="AM">上午（半日計）</option>
        </select></div>
    </div>

    <label>請假事由 *（{{ MAX_REASON_LEN }} 字內）</label>
    <textarea name="reason" maxlength="{{ MAX_REASON_LEN }}" placeholder="請簡述原因">{{ form.get('reason','') }}</textarea>

    <label>證明文件（病假必傳；PDF / 圖片 / Word，≤8MB）</label>
    <input type="file" name="attachment">

    <div class="actions">
      <button class="btn" type="submit">提交</button>
      <a class="btn ghost" href="{{ url_for('my_requests') }}">取消</a>
    </div>
  </form>
</div>

<div class="card">
  <h3>提示</h3>
  <p class="muted" style="margin:0" id="hint">
    請假超過 {{ FACULTY_THRESHOLD_DAYS }} 天會自動送院系複核。
  </p>
  <ul class="muted" style="margin:8px 0 0; padding-left:18px">
    <li>單張假單最多 {{ MAX_SINGLE_DAYS }} 天。</li>
    <li>最多可回溯補請 {{ MAX_BACKDATE_DAYS }} 天內的假。</li>
    <li>同一區間不可重複請假（已駁回／已撤回的假單不佔用區間）。</li>
    <li id="days-preview"></li>
  </ul>
</div>

<script>
// 天數試算（與後端 calc_days 同邏輯，僅供提交前預覽）
function calcDays(){
  var sd = document.querySelector('[name=start_date]').value;
  var ed = document.querySelector('[name=end_date]').value;
  var out = document.getElementById('days-preview');
  if(!sd || !ed){ out.textContent = ''; return; }
  var s = new Date(sd + 'T00:00:00'), e = new Date(ed + 'T00:00:00');
  if(e < s){ out.textContent = '結束日期早於開始日期。'; return; }
  var sp = document.querySelector('[name=start_period]').value;
  var ep = document.querySelector('[name=end_period]').value;
  var days;
  if(sd === ed){ days = (sp === 'AM' && ep === 'PM') ? 1.0 : 0.5; }
  else {
    var full = Math.round((e - s) / 86400000) - 1;
    days = Math.max(full, 0) + (sp === 'PM' ? 0.5 : 1.0) + (ep === 'AM' ? 0.5 : 1.0);
  }
  var msg = '預計請假 ' + days + ' 天';
  msg += days > {{ FACULTY_THRESHOLD_DAYS }} ? '（> {{ FACULTY_THRESHOLD_DAYS }} 天，需院系複核）。' : '。';
  out.textContent = msg;
}
['start_date','end_date','start_period','end_period'].forEach(function(n){
  document.querySelector('[name=' + n + ']').addEventListener('change', calcDays);
});
calcDays();

document.getElementById('lt').addEventListener('change', function(){
  var o = this.options[this.selectedIndex];
  var hint = document.getElementById('hint');
  var msg = [];
  if (o.dataset.att === '1') msg.push('此假別必須上傳證明文件。');
  if (o.dataset.nf === '1') msg.push('此假別無論天數都需院系複核。');
  else msg.push('請假超過 {{ FACULTY_THRESHOLD_DAYS }} 天會自動送院系複核。');
  hint.innerHTML = msg.join('<br>');
});
</script>
{% endblock %}
