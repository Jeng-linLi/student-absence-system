{% extends "base.html" %}
{% block title %}忘記密碼 · 線上請假系統{% endblock %}
{% block content %}
<h1>忘記密碼</h1>

<div class="card" style="max-width:480px">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>登記的 Email</label>
    <input type="email" name="email" placeholder="name@example.edu" required autofocus>
    <div class="actions">
      <button class="btn" type="submit">寄送重設連結</button>
      <a class="btn ghost" href="{{ url_for('login') }}">返回登入</a>
    </div>
  </form>
  <p class="muted" style="margin:12px 0 0">
    若此 Email 已登記，系統會寄出一封含重設連結的信（連結具時效，逾期請重新申請）。
    沒收到請檢查垃圾郵件夾，或聯絡管理員重設。
  </p>
</div>
{% endblock %}
